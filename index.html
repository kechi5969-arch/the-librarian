<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>THE LIBRARY</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  touch-action:none;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none;
  user-select:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#start{
  position:fixed;
  inset:0;
  z-index:10;
  background:
    radial-gradient(circle at center,#171717 0%,#050505 55%,#000 100%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

#start h1{
  font-size:42px;
  letter-spacing:8px;
  margin:0 0 12px;
}

#start p{
  color:#aaa;
  font-size:13px;
  margin-bottom:35px;
}

#start button{
  background:#111;
  color:#fff;
  border:1px solid #777;
  padding:15px 45px;
  font-size:16px;
  letter-spacing:3px;
}

#message{
  position:fixed;
  left:50%;
  top:15%;
  transform:translateX(-50%);
  z-index:5;
  text-align:center;
  font-size:18px;
  text-shadow:0 2px 10px #000;
  width:90%;
  pointer-events:none;
}

#objective{
  position:fixed;
  left:18px;
  top:18px;
  z-index:5;
  font-size:13px;
  color:#ccc;
  background:rgba(0,0,0,.45);
  padding:9px 12px;
  border-left:2px solid #aaa;
}

#cross{
  position:fixed;
  left:50%;
  top:50%;
  width:5px;
  height:5px;
  transform:translate(-50%,-50%);
  border:1px solid #aaa;
  border-radius:50%;
  z-index:4;
}

#joystick{
  position:fixed;
  z-index:6;
  left:20px;
  bottom:25px;
  width:120px;
  height:120px;
  border:1px solid #555;
  border-radius:50%;
  background:rgba(255,255,255,.04);
}

#stick{
  position:absolute;
  width:42px;
  height:42px;
  left:39px;
  top:39px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
}

#look{
  position:fixed;
  right:0;
  top:0;
  width:65%;
  height:100%;
  z-index:3;
}

#flash{
  position:fixed;
  right:20px;
  bottom:30px;
  z-index:7;
  padding:12px;
  background:#111;
  color:white;
  border:1px solid #555;
}

#rotate{position:fixed;inset:0;z-index:40;background:#050505;color:#ccc;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;letter-spacing:.18em;font-size:14px}
#clock{position:fixed;top:16px;right:18px;z-index:8;font-size:20px;letter-spacing:.2em;opacity:0;transition:opacity 1s;text-shadow:0 2px 12px #000}
#fade{
  position:fixed;
  inset:0;
  z-index:20;
  background:#000;
  pointer-events:none;
  opacity:0;
}
</style>
</head>

<body>

<div id="start">
  <h1>THE LIBRARY</h1>
  <p>THE LIBRARY CLOSES AT 22:00</p>
  <p style="margin-top:-20px;color:#666;font-size:11px;letter-spacing:.2em">気づかなければ、何も起こらない</p>
  <button id="startBtn">SOLO PLAY</button>
</div>

<div id="objective">
  目的：図書館から出る
</div>

<div id="clock">17:00</div>
<div id="message"></div>
<div id="cross"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="look"></div>

<button id="flash">LIGHT</button>

<div id="rotate">画面を横にしてください</div>
<div id="fade"></div>

<script type="module">

// orient

addEventListener('gesturestart', e=>e.preventDefault());
addEventListener('gesturechange', e=>e.preventDefault());
addEventListener('dblclick', e=>e.preventDefault());
document.addEventListener('touchend', e=>{
  const now=Date.now();
  if (now-(window._lt||0)<350) e.preventDefault();
  window._lt=now;
}, {passive:false});

function applyOrient(){
  const port = innerHeight > innerWidth;
  const el=document.getElementById('rotate');
  if (el) el.style.display = port ? 'flex' : 'none';
}
addEventListener('resize', applyOrient);
addEventListener('orientationchange', applyOrient);
applyOrient();

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =========================
   基本設定
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xc8c4b8);

scene.fog = new THREE.Fog(
  0xc8c4b8,
  16,
  42
);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .05,
  100
);

camera.position.set(0, 1.28, 14.15);

const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   光
========================= */

const ambient =
new THREE.AmbientLight(
  0xffe6c4,
  1.05
);

scene.add(ambient);

const ceilingLight =
new THREE.PointLight(
  0xfff3d6,
  1.8,
  28
);

ceilingLight.position.set(
  0,4,0
);

scene.add(ceilingLight);
const fluors=[];
for(let z=-16;z<=16;z+=4){
 for(let x=-10;x<=10;x+=5){
  const tube=new THREE.Mesh(new THREE.BoxGeometry(3.6,.06,.12),
   new THREE.MeshStandardMaterial({color:0xf5f3ea,emissive:0xe8e0c8,emissiveIntensity:0.7}));
  tube.position.set(x,4.85,z); scene.add(tube);
  const pl=new THREE.PointLight(0xfff6e0,0.55,8);
  pl.position.set(x,4.6,z); scene.add(pl); fluors.push(pl);
 }
}



/* 懐中電灯 */

const flashlight =
new THREE.SpotLight(
  0xffffff,
  7,
  18,
  Math.PI/8,
  .6
);

scene.add(flashlight);

scene.add(
  flashlight.target
);


/* =========================
   マテリアル
========================= */

const floorMat =
new THREE.MeshStandardMaterial({
  color:0x6a2a28,
  roughness:1
});

const wallMat =
new THREE.MeshStandardMaterial({
  color:0xc8c2b4,
  roughness:1
});

const woodMat =
new THREE.MeshStandardMaterial({
  color:0xc4a36a,
  roughness:1
});

const blackMat =
new THREE.MeshStandardMaterial({
  color:0x050505
});


/* =========================
   床
========================= */

const floor =
new THREE.Mesh(
  new THREE.PlaneGeometry(48,56),
  floorMat
);

floor.rotation.x=-Math.PI/2;

floor.receiveShadow=true;

scene.add(floor);


/* =========================
   壁
========================= */

function wall(
 x,y,z,
 sx,sy,sz
){

 const w =
 new THREE.Mesh(
  new THREE.BoxGeometry(
   sx,sy,sz
  ),
  wallMat
 );

 w.position.set(x,y,z);

 w.receiveShadow=true;

 scene.add(w);

 return w;
}

wall(0,2.6,-22,36,5.2,1);
wall(0,2.6,22,36,5.2,1);
wall(-18,2.6,0,1,5.2,44);
wall(18,2.6,0,1,5.2,44);
const ceil=new THREE.Mesh(new THREE.BoxGeometry(36,.2,44), new THREE.MeshStandardMaterial({color:0xe8e4d8,roughness:.9}));
ceil.position.y=5.1; scene.add(ceil);



/* =========================
   本棚
========================= */

function bookshelf(
 x,z,
 rotation=0
){

 const g =
 new THREE.Group();

 g.position.set(x,0,z);
 g.rotation.y=rotation;

 const body =
 new THREE.Mesh(
  new THREE.BoxGeometry(
   1.4,3.2,.55
  ),
  woodMat
 );

 body.position.y=1.6;

 g.add(body);

 for(let i=0;i<4;i++){

   const shelf =
   new THREE.Mesh(
    new THREE.BoxGeometry(
     1.3,.08,.7
    ),
    blackMat
   );

   shelf.position.set(
    0,
    .45+i*.72,
    -.05
   );

   g.add(shelf);

   for(let j=0;j<5;j++){

     const book =
     new THREE.Mesh(
      new THREE.BoxGeometry(
       .16,.48,.28
      ),
      new THREE.MeshStandardMaterial({
       color:
       0x222222+
       Math.floor(Math.random()*0x333333)
      })
     );

     book.position.set(
      -.5+j*.23,
      .7+i*.72,
      .02
     );

     g.add(book);
   }
 }

 scene.add(g);
}


function lowRange(x,z,rot=0){
 const g=new THREE.Group();
 g.position.set(x,0,z); g.rotation.y=rot;
 const body=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.15,.55), woodMat);
 body.position.y=.58; g.add(body);
 for(let i=0;i<2;i++){
  for(let j=0;j<10;j++){
   const book=new THREE.Mesh(new THREE.BoxGeometry(.18,.42,.22),
    new THREE.MeshStandardMaterial({color:0x202020+Math.floor(Math.random()*0x505050)}));
   book.position.set(-1.4+j*.28,.38+i*.42,.08);
   g.add(book);
  }
 }
 scene.add(g);
}
/* 中央の低い書架（写真の列） */
for(let row=0;row<6;row++){
 for(let col=-2;col<=2;col++){
  lowRange(col*3.4, 4-row*2.4);
 }
}
/* 外周の高い本棚 */
for(let z=-16;z<=10;z+=3.2){
 bookshelf(-15,z);
 bookshelf(15,z);
}
for(let x=-12;x<=12;x+=3.2){
 bookshelf(x,-18,Math.PI/2);
}


/* =========================
   机
========================= */

function desk(x,z){

 const g=new THREE.Group();

 g.position.set(x,0,z);

 const top =
 new THREE.Mesh(
  new THREE.BoxGeometry(
   2.2,.18,1
  ),
  woodMat
 );

 top.position.y=1;

 g.add(top);

 for(const dx of [-.85,.85])
 for(const dz of [-.35,.35]){

   const leg =
   new THREE.Mesh(
    new THREE.BoxGeometry(
     .12,1,.12
    ),
    woodMat
   );

   leg.position.set(
    dx,.5,dz
   );

   g.add(leg);
 }

 scene.add(g);
}

desk(0,13);
desk(-3.2,13);
desk(3.2,13);
desk(-6.4,13);
desk(6.4,13);

/* 人型（最初は出さない） */
const figure = new THREE.Group();
const bodyF = new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,1.5,6), blackMat);
bodyF.position.y=1.15; figure.add(bodyF);
const headF = new THREE.Mesh(new THREE.SphereGeometry(.16,8,8), new THREE.MeshStandardMaterial({color:0xdedede,roughness:1}));
headF.position.y=2.05; figure.add(headF);
const eyeG = new THREE.MeshStandardMaterial({color:0x050505});
const e1=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),eyeG); e1.position.set(-.05,2.07,.13); figure.add(e1);
const e2=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),eyeG); e2.position.set(.05,2.07,.13); figure.add(e2);
const armL=new THREE.Mesh(new THREE.CylinderGeometry(.03,.02,1.1,5), blackMat); armL.position.set(-.22,.7,0); figure.add(armL);
const armR=new THREE.Mesh(new THREE.CylinderGeometry(.03,.02,1.1,5), blackMat); armR.position.set(.22,.7,0); figure.add(armR);
figure.position.set(-5.2,0,-2);
figure.visible=false;
scene.add(figure);

const looseBook = new THREE.Mesh(new THREE.BoxGeometry(.22,.04,.16), new THREE.MeshStandardMaterial({color:0x6a2a2a}));
looseBook.position.set(0.12,1.12,12.55);
scene.add(looseBook);

const odd = { lookedAway:false, seen:false, bookMoved:false };


const deskLamp = new THREE.PointLight(0xffe6b0, 1.6, 6);
deskLamp.position.set(0.45,1.35,12.7);
scene.add(deskLamp);
const lampMesh = new THREE.Mesh(new THREE.CylinderGeometry(.05,.12,.35,8), woodMat);
lampMesh.position.set(0.55,1.28,12.7);
scene.add(lampMesh);



/* =========================
   出口
========================= */

const exit =
new THREE.Mesh(
 new THREE.BoxGeometry(
  2.5,3,.3
 ),
 new THREE.MeshStandardMaterial({
  color:0x222222
 })
);

exit.position.set(
 0,1.5,-11.4
);

scene.add(exit);


/* EXIT文字 */

const exitLight =
new THREE.PointLight(
 0xff2222,
 1,
 5
);

exitLight.position.set(
 0,3,-11
);

scene.add(exitLight);


/* =========================
   プレイヤー
========================= */

let yaw=0;
let pitch=-0.28;
let canMove=false;

const keys={};

addEventListener(
 "keydown",
 e=>keys[e.code]=true
);

addEventListener(
 "keyup",
 e=>keys[e.code]=false
);


/* =========================
   スマホ操作
========================= */

let joyX=0;
let joyY=0;
let moving=false;

const joystick=
document.querySelector("#joystick");

const stick=
document.querySelector("#stick");

joystick.addEventListener(
 "pointerdown",
 e=>{
  moving=true;
  joystick.setPointerCapture(
   e.pointerId
  );
 }
);

joystick.addEventListener(
 "pointermove",
 e=>{

  if(!moving)return;

  const r=
  joystick.getBoundingClientRect();

  let x=
  e.clientX-
  (r.left+r.width/2);

  let y=
  e.clientY-
  (r.top+r.height/2);

  const max=40;

  const len=
  Math.hypot(x,y);

  if(len>max){

   x=x/len*max;
   y=y/len*max;

  }

  joyX=x/max;
  joyY=y/max;

  stick.style.transform=
  `translate(${x}px,${y}px)`;
 }
);

joystick.addEventListener(
 "pointerup",
 ()=>{
  moving=false;
  joyX=0;
  joyY=0;
  stick.style.transform="";
 }
);


/* 視点 */

let lookDown=false;
let lastX=0;
let lastY=0;

const look=
document.querySelector("#look");

look.addEventListener(
 "pointerdown",
 e=>{
  lookDown=true;
  lastX=e.clientX;
  lastY=e.clientY;
 }
);

look.addEventListener(
 "pointermove",
 e=>{

  if(!lookDown)return;

  yaw += (e.clientX-lastX)*.004;

  pitch -=
  (e.clientY-lastY)*.003;

  pitch=
  Math.max(
   -1.2,
   Math.min(1.2,pitch)
  );

  lastX=e.clientX;
  lastY=e.clientY;
 }
);

look.addEventListener(
 "pointerup",
 ()=>{
  lookDown=false;
 }
);


/* =========================
   メッセージ
========================= */

const message=
document.querySelector("#message");

function showMessage(
 text,
 time=3000
){

 message.textContent=text;

 setTimeout(
  ()=>{
   message.textContent="";
  },
  time
 );

}


/* =========================
   ゲーム開始
========================= */

document
.querySelector("#startBtn")
.onclick=()=>{

 document
 .querySelector("#start")
 .style.display="none";
 try{screen.orientation&&screen.orientation.lock("landscape")}catch(e){}

 canMove=false;
 pitch=-0.55;
 yaw=0;
 camera.position.set(0,1.26,14.15);
 const clk=document.getElementById('clock');
 const fade=document.getElementById('fade');
 function showClock(t){
  clk.textContent=t; clk.style.opacity=1;
  setTimeout(()=>{clk.style.opacity=0;},3000);
 }
 function blink(cb){
  fade.style.transition='opacity .12s';
  fade.style.opacity=1;
  setTimeout(()=>{ fade.style.opacity=0; if(cb)cb(); },180);
 }
 showClock('17:00');
 showMessage("ページの端を、指で押さえている。", 2800);
 setTimeout(()=>{
  pitch=-0.12; yaw=-0.55;
  showMessage("窓の外は、もうオレンジだ。", 2500);
 }, 3200);
 setTimeout(()=>{
  yaw=0.6;
  showMessage("……誰も、残っていない。", 2400);
 }, 6000);
 setTimeout(()=>{
  yaw=0; pitch=-0.5;
  showMessage("本を閉じる。", 2000);
  looseBook.rotation.x=-0.9;
 }, 8800);
 setTimeout(()=>{
  blink(()=>{
   scene.background.set(0x0c0c0e);
   scene.fog.color.set(0x0c0c0e);
   scene.fog.near=4; scene.fog.far=22;
   ambient.intensity=.22;
   ceilingLight.intensity=.2;
   fluors.forEach(f=>f.intensity=.08);
   deskLamp.intensity=.35;
   showClock('22:00');
  });
 }, 11200);
 setTimeout(()=>{
  showMessage("もうこんな時間か。帰ろう。", 2800);
  document.querySelector("#objective").textContent="目的：荷物をまとめて帰る";
  canMove=true; pitch=0; camera.position.y=1.62;
  odd.bookMoved=true;
 }, 12800);

};


/* =========================
   懐中電灯
========================= */

let lightOn=true;

document
.querySelector("#flash")
.onclick=()=>{

 lightOn=!lightOn;

 flashlight.intensity=
 lightOn?7:.2;

};


/* =========================
   時間演出
========================= */

let darkness=0;

setTimeout(
 ()=>{

  darkness=1;

  ceilingLight.intensity=.15;

  showMessage(
   "23:47",
   2500
  );

 },
 999999
);


/* =========================
   移動
========================= */

let lastTime=
performance.now();

function animate(time){

 requestAnimationFrame(
  animate
 );

 const dt=
 Math.min(
  .05,
  (time-lastTime)/1000
 );

 lastTime=time;


 let forward=
 (keys.KeyW?1:0)
 -
 (keys.KeyS?1:0)
 -
 joyY;

 let strafe=
 (keys.KeyD?1:0)
 -
 (keys.KeyA?1:0)
 +
 joyX;

 const speed=
 (canMove?2.5:0)*dt;

 camera.position.x +=
 (
  Math.sin(yaw)*forward +
  Math.cos(yaw)*strafe
 )*speed;

 camera.position.z +=
 (
  -Math.cos(yaw)*forward +
  Math.sin(yaw)*strafe
 )*speed;


 /* 壁から出ない */

 camera.position.x=
 Math.max(
  -16.5,
  Math.min(16.5,
  camera.position.x)
 );

 camera.position.z=
 Math.max(
  -16.5,
  Math.min(16.5,
  camera.position.z)
 );

 camera.position.y=1.65;


 /* 視線 */

 const target=
 new THREE.Vector3(
  camera.position.x+
  Math.sin(yaw)*
  Math.cos(pitch),

  camera.position.y+
  Math.sin(pitch),

  camera.position.z-
  Math.cos(yaw)*
  Math.cos(pitch)
 );

 camera.lookAt(target);


 flashlight.position
 .copy(camera.position);

 flashlight.target
 .position
 .copy(target);


 /* 時々照明がちらつく */

 if(
  darkness &&
  Math.random()<.025
 ){

  ceilingLight.intensity=
  Math.random()*.4;

 }



 /* 二度見 */
 const lookZ = -Math.cos(yaw);
 const lookingHall = Math.abs(yaw) > 0.7;
 if (canMove && odd.bookMoved && lookingHall) odd.lookedAway = true;
 if (canMove && odd.lookedAway && !odd.seen && Math.abs(yaw) < 0.35) {
  figure.visible = true;
  figure.position.set(-4.6,0,1.2);
  figure.lookAt(camera.position.x, 1.6, camera.position.z);
  odd.seen = true;
  showMessage("……今、本棚のあいだに。", 2200);
  setTimeout(()=>{ figure.visible=false; showMessage("いない。", 1800); }, 1600);
 }
 const fd = Math.hypot(figure.position.x-camera.position.x, figure.position.z-camera.position.z);
 if (figure.visible && fd < 2.2) {
  figure.visible=false;
  showMessage("振り返ると、もういない。", 2000);
 }

 renderer.render(
  scene,
  camera
 );

}

animate(
 performance.now()
);


/* =========================
   画面サイズ
========================= */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
  innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);

</script>

</body>
</html>
