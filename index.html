<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>THE LIBRARY</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  touch-action:none;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none;
  user-select:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#start{
  position:fixed;
  inset:0;
  z-index:10;
  background:
    radial-gradient(circle at center,#171717 0%,#050505 55%,#000 100%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

#start h1{
  font-size:42px;
  letter-spacing:8px;
  margin:0 0 12px;
}

#start p{
  color:#aaa;
  font-size:13px;
  margin-bottom:35px;
}

#start button{
  background:#111;
  color:#fff;
  border:1px solid #777;
  padding:15px 45px;
  font-size:16px;
  letter-spacing:3px;
}

#message{
  position:fixed;
  left:50%;
  top:15%;
  transform:translateX(-50%);
  z-index:5;
  text-align:center;
  font-size:18px;
  text-shadow:0 2px 10px #000;
  width:90%;
  pointer-events:none;
}

#objective{
  position:fixed;
  left:18px;
  top:18px;
  z-index:5;
  font-size:13px;
  color:#ccc;
  background:rgba(0,0,0,.45);
  padding:9px 12px;
  border-left:2px solid #aaa;
}

#cross{
  position:fixed;
  left:50%;
  top:50%;
  width:5px;
  height:5px;
  transform:translate(-50%,-50%);
  border:1px solid #aaa;
  border-radius:50%;
  z-index:4;
}

#joystick{
  position:fixed;
  z-index:6;
  left:20px;
  bottom:25px;
  width:120px;
  height:120px;
  border:1px solid #555;
  border-radius:50%;
  background:rgba(255,255,255,.04);
}

#stick{
  position:absolute;
  width:42px;
  height:42px;
  left:39px;
  top:39px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
}

#look{
  position:fixed;
  right:0;
  top:0;
  width:65%;
  height:100%;
  z-index:3;
}

#flash{
  position:fixed;
  right:20px;
  bottom:30px;
  z-index:7;
  padding:12px;
  background:#111;
  color:white;
  border:1px solid #555;
}

#rotate{position:fixed;inset:0;z-index:40;background:#050505;color:#ccc;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;letter-spacing:.18em;font-size:14px}
#clock{position:fixed;top:16px;right:18px;z-index:8;font-size:20px;letter-spacing:.2em;opacity:0;transition:opacity 1s;text-shadow:0 2px 12px #000}
#fade{
  position:fixed;
  inset:0;
  z-index:20;
  background:#000;
  pointer-events:none;
  opacity:0;
}
</style>
</head>

<body>

<div id="start">
  <h1>THE LIBRARY</h1>
  <p>THE LIBRARY CLOSES AT 22:00</p>
  <p style="margin-top:-20px;color:#666;font-size:11px;letter-spacing:.2em">気づかなければ、何も起こらない</p>
  <button id="startBtn">SOLO PLAY</button>
</div>

<div id="objective">
  目的：図書館から出る
</div>

<div id="clock">17:00</div>
<div id="message"></div>
<div id="cross"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="look"></div>

<button id="flash">LIGHT</button>

<div id="rotate">画面を横にしてください</div>
<div id="fade"></div>

<script type="module">

// orient

addEventListener('gesturestart', e=>e.preventDefault());
addEventListener('gesturechange', e=>e.preventDefault());
addEventListener('dblclick', e=>e.preventDefault());
document.addEventListener('touchend', e=>{
  const now=Date.now();
  if (now-(window._lt||0)<350) e.preventDefault();
  window._lt=now;
}, {passive:false});

function applyOrient(){
  const port = innerHeight > innerWidth;
  const el=document.getElementById('rotate');
  if (el) el.style.display = port ? 'flex' : 'none';
}
addEventListener('resize', applyOrient);
addEventListener('orientationchange', applyOrient);
applyOrient();

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =========================
   基本設定
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x3a342c);

scene.fog = new THREE.Fog(
  0x3a342c,
  10,
  34
);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .05,
  100
);

camera.position.set(0, 1.28, 14.15);

const renderer =
new THREE.WebGLRenderer({
  antialias:false
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.15)
);

renderer.shadowMap.enabled=false;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   光
========================= */

const ambient =
new THREE.AmbientLight(
  0xc4b090,
  .55
);

scene.add(ambient);

const ceilingLight =
new THREE.PointLight(
  0xfff3d6,
  1.8,
  28
);

ceilingLight.position.set(
  0,4,0
);

scene.add(ceilingLight);
const fluors=[];
for(let z=-12;z<=12;z+=8){
 for(let x=-8;x<=8;x+=8){
  const tube=new THREE.Mesh(new THREE.BoxGeometry(3.6,.06,.12),
   new THREE.MeshStandardMaterial({color:0xf5f3ea,emissive:0xe8e0c8,emissiveIntensity:0.7}));
  tube.position.set(x,4.85,z); scene.add(tube);
  fluors.push(tube);
 }
}



/* 懐中電灯 */

const flashlight =
new THREE.SpotLight(
  0xffffff,
  7,
  18,
  Math.PI/8,
  .6
);

scene.add(flashlight);

scene.add(
  flashlight.target
);


/* =========================
   マテリアル
========================= */

const floorMat =
new THREE.MeshStandardMaterial({
  color:0x4a1c1c,
  roughness:1
});

const wallMat =
new THREE.MeshStandardMaterial({
  color:0x2c2c2e,
  roughness:1
});

const woodMat =
new THREE.MeshStandardMaterial({
  color:0x6a4a2e,
  roughness:1
});

const blackMat =
new THREE.MeshStandardMaterial({
  color:0x050505
});


/* =========================
   床
========================= */

const floor =
new THREE.Mesh(
  new THREE.PlaneGeometry(72,80),
  floorMat
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

function wall(x,y,z,sx,sy,sz,mat=wallMat){
 const w=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
 w.position.set(x,y,z);
 scene.add(w);
 return w;
}
wall(0,3,-32,52,6,1);
wall(0,3,32,52,6,1);
wall(-26,3,0,1,6,64);
wall(26,3,0,1,6,64);
const ceil=new THREE.Mesh(new THREE.BoxGeometry(52,.2,64), new THREE.MeshStandardMaterial({color:0xe8e4d8,roughness:.9}));
ceil.position.y=5.4; scene.add(ceil);

const bookCols=[0x3a2a22,0x6a3030,0x2a3a4a,0x4a4a2a,0x2a2a2a];
function tallShelf(x,z,len=3.2,rot=0){
 const g=new THREE.Group();
 g.position.set(x,0,z); g.rotation.y=rot;
 const body=new THREE.Mesh(new THREE.BoxGeometry(len,3.0,.46), woodMat);
 body.position.y=1.5; g.add(body);
 for(let i=0;i<5;i++){
  const sl=new THREE.Mesh(new THREE.BoxGeometry(len-.08,.05,.5), blackMat);
  sl.position.set(0,.28+i*.55,.02); g.add(sl);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(len-.2,.42,.16),
   new THREE.MeshStandardMaterial({color:bookCols[i%bookCols.length],roughness:1}));
  stripe.position.set(0,.5+i*.55,.14); g.add(stripe);
 }
 scene.add(g);
}

/* 3m本棚で迷路。通路は約2m */
/* 俯瞰図ベース：下=入口(+Z) 上=出口(-Z) 通路約1.8m */
const H=0, V=Math.PI/2;
const maze=[
 // 外周
 [-20,8,16,V],[20,8,16,V],[-20,-12,16,V],[20,-12,16,V],
 [-10,22,16,H],[10,22,16,H],
 [-16,-26,12,H],[16,-26,12,H],
 // 入口から中央通路を挟む壁
 [-6,16,8,V],[6,16,8,V],
 [-10,12,6,H],[10,12,6,H],
 [-16,10,6,V],[16,10,6,V],
 // 中段のコの字
 [-8,4,8,H],[8,4,8,H],
 [-4,0,6,V],[4,0,6,V],
 [0,-2,7,H],
 // 左右の袋小路
 [-14,2,6,H],[14,2,6,H],
 [-14,-6,7,V],[14,-6,7,V],
 [-8,-8,6,H],[8,-8,6,H],
 // 中央の島
 [-3,-10,5,H],[3,-10,5,H],
 [0,-14,6,H],
 [-6,-16,6,V],[6,-16,6,V],
 // 出口前
 [-8,-22,7,V],[8,-22,7,V],
 [0,-24,5,H]
];
maze.forEach(([x,z,len,rot])=>tallShelf(x,z,len,rot));

/* 赤い通路の床（中央線） */
function runner(x,z,sx,sz){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,.02,sz), new THREE.MeshStandardMaterial({color:0x5a1010,roughness:1}));
 m.position.set(x,.01,z); scene.add(m);
}
runner(0,18,2.2,16);
runner(0,-6,2.2,20);
runner(-12,6,2.0,10);
runner(12,6,2.0,10);


function desk(x,z,w=2.1){
 const g=new THREE.Group(); g.position.set(x,0,z);
 const top=new THREE.Mesh(new THREE.BoxGeometry(w,.1,0.9), woodMat);
 top.position.y=.78; g.add(top);
 for(const dx of [-w*.38,w*.38]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.1,.78,.1), woodMat);
  leg.position.set(dx,.39,0.28); g.add(leg);
  const leg2=leg.clone(); leg2.position.z=-0.28; g.add(leg2);
 }
 scene.add(g);
}
function chair(x,z){
 const s=new THREE.Mesh(new THREE.BoxGeometry(.42,.08,.42), woodMat);
 s.position.set(x,.46,z); scene.add(s);
 const b=new THREE.Mesh(new THREE.BoxGeometry(.42,.42,.08), woodMat);
 b.position.set(x,.68,z+.18); scene.add(b);
}
/* 入口の机は自分用1つ＋隠れる机は点在 */
desk(0,13); chair(0,13.7);
desk(-12,14,1.4); chair(-12,14.7);
desk(12,14,1.4); chair(12,14.7);
desk(0,-6,1.4); chair(0,-5.3);
desk(-12,-4,1.4); chair(-12,-3.3);
desk(12,-18,1.4); chair(12,-17.3);

/* 入口カウンター */
const counter=new THREE.Group();
counter.position.set(4,0,23);
const cTop=new THREE.Mesh(new THREE.BoxGeometry(5.2,.12,1.1), woodMat);
cTop.position.y=1.05; counter.add(cTop);
const cFront=new THREE.Mesh(new THREE.BoxGeometry(5.2,1.05,.16), woodMat);
cFront.position.set(0,.52,.48); counter.add(cFront);
const cPc=new THREE.Mesh(new THREE.BoxGeometry(.5,.04,.35), blackMat);
cPc.position.set(-1.2,1.14,0); counter.add(cPc);
const cMon=new THREE.Mesh(new THREE.BoxGeometry(.46,.32,.04), blackMat);
cMon.position.set(-1.2,1.34,-.12); counter.add(cMon);
scene.add(counter);
const counterLight=new THREE.PointLight(0xffe8c0,0.7,6);
counterLight.position.set(4,2.2,23); scene.add(counterLight);

/* 人型（最初は出さない） */
const figure = new THREE.Group();
const bodyF = new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,1.5,6), blackMat);
bodyF.position.y=1.15; figure.add(bodyF);
const headF = new THREE.Mesh(new THREE.SphereGeometry(.16,8,8), new THREE.MeshStandardMaterial({color:0xdedede,roughness:1}));
headF.position.y=2.05; figure.add(headF);
const eyeG = new THREE.MeshStandardMaterial({color:0x050505});
const e1=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),eyeG); e1.position.set(-.05,2.07,.13); figure.add(e1);
const e2=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),eyeG); e2.position.set(.05,2.07,.13); figure.add(e2);
const armL=new THREE.Mesh(new THREE.CylinderGeometry(.03,.02,1.1,5), blackMat); armL.position.set(-.22,.7,0); figure.add(armL);
const armR=new THREE.Mesh(new THREE.CylinderGeometry(.03,.02,1.1,5), blackMat); armR.position.set(.22,.7,0); figure.add(armR);
figure.position.set(-5.2,0,-2);
figure.visible=false;
scene.add(figure);

const looseBook = new THREE.Mesh(new THREE.BoxGeometry(.22,.04,.16), new THREE.MeshStandardMaterial({color:0x6a2a2a}));
looseBook.position.set(0.12,1.12,12.55);
scene.add(looseBook);

const odd = { lookedAway:false, seen:false, bookMoved:false };


const deskLamp = new THREE.PointLight(0xffe6b0, 1.6, 6);
deskLamp.position.set(0.45,1.35,12.7);
scene.add(deskLamp);
const lampMesh = new THREE.Mesh(new THREE.CylinderGeometry(.05,.12,.35,8), woodMat);
lampMesh.position.set(0.55,1.28,12.7);
scene.add(lampMesh);



/* =========================
   出口
========================= */

const exit =
new THREE.Mesh(
 new THREE.BoxGeometry(
  2.5,3,.3
 ),
 new THREE.MeshStandardMaterial({
  color:0x222222
 })
);

exit.position.set(0,1.5,-30);

scene.add(exit);


/* EXIT文字 */

const exitLight =
new THREE.PointLight(
 0xff2222,
 1,
 5
);

exitLight.position.set(
 0,3,-11
);

scene.add(exitLight);


/* =========================
   プレイヤー
========================= */

let yaw=0;
let pitch=-0.28;
let canMove=false;

const keys={};

addEventListener(
 "keydown",
 e=>keys[e.code]=true
);

addEventListener(
 "keyup",
 e=>keys[e.code]=false
);


/* =========================
   スマホ操作
========================= */

let joyX=0;
let joyY=0;
let moving=false;

const joystick=
document.querySelector("#joystick");

const stick=
document.querySelector("#stick");

joystick.addEventListener(
 "pointerdown",
 e=>{
  moving=true;
  joystick.setPointerCapture(
   e.pointerId
  );
 }
);

joystick.addEventListener(
 "pointermove",
 e=>{

  if(!moving)return;

  const r=
  joystick.getBoundingClientRect();

  let x=
  e.clientX-
  (r.left+r.width/2);

  let y=
  e.clientY-
  (r.top+r.height/2);

  const max=40;

  const len=
  Math.hypot(x,y);

  if(len>max){

   x=x/len*max;
   y=y/len*max;

  }

  joyX=x/max;
  joyY=y/max;

  stick.style.transform=
  `translate(${x}px,${y}px)`;
 }
);

joystick.addEventListener(
 "pointerup",
 ()=>{
  moving=false;
  joyX=0;
  joyY=0;
  stick.style.transform="";
 }
);


/* 視点 */

let lookDown=false;
let lastX=0;
let lastY=0;

const look=
document.querySelector("#look");

look.addEventListener(
 "pointerdown",
 e=>{
  lookDown=true;
  lastX=e.clientX;
  lastY=e.clientY;
 }
);

look.addEventListener(
 "pointermove",
 e=>{

  if(!lookDown)return;

  yaw += (e.clientX-lastX)*.004;

  pitch -=
  (e.clientY-lastY)*.003;

  pitch=
  Math.max(
   -1.2,
   Math.min(1.2,pitch)
  );

  lastX=e.clientX;
  lastY=e.clientY;
 }
);

look.addEventListener(
 "pointerup",
 ()=>{
  lookDown=false;
 }
);


/* =========================
   メッセージ
========================= */

const message=
document.querySelector("#message");

function showMessage(
 text,
 time=3000
){

 message.textContent=text;

 setTimeout(
  ()=>{
   message.textContent="";
  },
  time
 );

}


/* =========================
   ゲーム開始
========================= */

document
.querySelector("#startBtn")
.onclick=()=>{

 document
 .querySelector("#start")
 .style.display="none";
 try{screen.orientation&&screen.orientation.lock("landscape")}catch(e){}

 canMove=false;
 pitch=-0.55;
 yaw=0;
 camera.position.set(0,1.26,14.15);
 const clk=document.getElementById('clock');
 const fade=document.getElementById('fade');
 function showClock(t){
  clk.textContent=t; clk.style.opacity=1;
  setTimeout(()=>{clk.style.opacity=0;},3000);
 }
 function blink(cb){
  fade.style.transition='opacity .55s';
  fade.style.opacity=1;
  setTimeout(()=>{
   if(cb)cb();
   fade.style.transition='opacity .9s';
   fade.style.opacity=0;
  },700);
 }
 showClock('17:00');
 showMessage("ページの端を、指で押さえている。", 2800);
 setTimeout(()=>{
  pitch=-0.12; yaw=-0.55;
  showMessage("窓の外は、もうオレンジだ。", 2500);
 }, 3200);
 setTimeout(()=>{
  yaw=0.6;
  showMessage("……誰も、残っていない。", 2400);
 }, 6000);
 setTimeout(()=>{
  yaw=0; pitch=-0.5;
  showMessage("本を閉じる。", 2000);
  looseBook.rotation.x=-0.9;
 }, 8800);
 setTimeout(()=>{
  blink(()=>{
   scene.background.set(0x0c0c0e);
   scene.fog.color.set(0x0c0c0e);
   scene.fog.near=4; scene.fog.far=22;
   ambient.intensity=.22;
   ceilingLight.intensity=.2;
   fluors.forEach(f=>{ if(f.intensity!=null) f.intensity=.08; if(f.material&&f.material.emissiveIntensity!=null) f.material.emissiveIntensity=.12; });
   deskLamp.intensity=.35;
   showClock('22:00');
  });
 }, 11200);
 setTimeout(()=>{
  showMessage("もうこんな時間か。帰ろう。", 2800);
  document.querySelector("#objective").textContent="目的：荷物をまとめて帰る";
  canMove=true; pitch=0; camera.position.y=1.62;
  odd.bookMoved=true;
 }, 12800);

};


/* =========================
   懐中電灯
========================= */

let lightOn=true;

document
.querySelector("#flash")
.onclick=()=>{

 lightOn=!lightOn;

 flashlight.intensity=
 lightOn?7:.2;

};


/* =========================
   時間演出
========================= */

let darkness=0;

setTimeout(
 ()=>{

  darkness=1;

  ceilingLight.intensity=.15;

  showMessage(
   "23:47",
   2500
  );

 },
 999999
);


/* =========================
   移動
========================= */

let lastTime=
performance.now();

function animate(time){

 requestAnimationFrame(
  animate
 );

 const dt=
 Math.min(
  .05,
  (time-lastTime)/1000
 );

 lastTime=time;


 let forward=
 (keys.KeyW?1:0)
 -
 (keys.KeyS?1:0)
 -
 joyY;

 let strafe=
 (keys.KeyD?1:0)
 -
 (keys.KeyA?1:0)
 +
 joyX;

 const speed=
 (canMove?2.5:0)*dt;

 camera.position.x +=
 (
  Math.sin(yaw)*forward +
  Math.cos(yaw)*strafe
 )*speed;

 camera.position.z +=
 (
  -Math.cos(yaw)*forward +
  Math.sin(yaw)*strafe
 )*speed;


 /* 壁から出ない */

 camera.position.x=
 Math.max(
  -30,
  Math.min(30,
  camera.position.x)
 );

 camera.position.z=
 Math.max(
  -30,
  Math.min(30,
  camera.position.z)
 );

 camera.position.y=1.65;


 /* 視線 */

 const target=
 new THREE.Vector3(
  camera.position.x+
  Math.sin(yaw)*
  Math.cos(pitch),

  camera.position.y+
  Math.sin(pitch),

  camera.position.z-
  Math.cos(yaw)*
  Math.cos(pitch)
 );

 camera.lookAt(target);


 flashlight.position
 .copy(camera.position);

 flashlight.target
 .position
 .copy(target);


 /* 時々照明がちらつく */

 if(
  darkness &&
  Math.random()<.025
 ){

  ceilingLight.intensity=
  Math.random()*.4;

 }



 /* 二度見 */
 const lookZ = -Math.cos(yaw);
 const lookingHall = Math.abs(yaw) > 0.7;
 if (canMove && odd.bookMoved && lookingHall) odd.lookedAway = true;
 if (canMove && odd.lookedAway && !odd.seen && Math.abs(yaw) < 0.35) {
  figure.visible = true;
  figure.position.set(-4.6,0,1.2);
  figure.lookAt(camera.position.x, 1.6, camera.position.z);
  odd.seen = true;
  showMessage("……今、本棚のあいだに。", 2200);
  setTimeout(()=>{ figure.visible=false; showMessage("いない。", 1800); }, 1600);
 }
 const fd = Math.hypot(figure.position.x-camera.position.x, figure.position.z-camera.position.z);
 if (figure.visible && fd < 2.2) {
  figure.visible=false;
  showMessage("振り返ると、もういない。", 2000);
 }

 renderer.render(
  scene,
  camera
 );

}

animate(
 performance.now()
);


/* =========================
   画面サイズ
========================= */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
  innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);

</script>

</body>
</html>
