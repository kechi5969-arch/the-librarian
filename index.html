function tallShelf(x,z,len=3.2,rot=0){

/* セル間の壁だけ消す穴掘り。通路幅≈1.8m */
const H=0,V=Math.PI/2;
const COLS=11, ROWS=13, CELL=3.5;
const vis=Array.from({length:ROWS},()=>Array(COLS).fill(false));
const wallE=Array.from({length:ROWS},()=>Array(COLS).fill(true));
const wallS=Array.from({length:ROWS},()=>Array(COLS).fill(true));
function carve(x,y){
  vis[y][x]=true;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);
  for(const [dx,dy] of dirs){
    const nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS||vis[ny][nx]) continue;
    if(dx===1) wallE[y][x]=false;
    if(dx===-1) wallE[ny][nx]=false;
    if(dy===1) wallS[y][x]=false;
    if(dy===-1) wallS[ny][nx]=false;
    carve(nx,ny);
  }
}
carve(5,0);
wallS[0][5]=false; wallS[ROWS-2][5]=false;
const ox=-((COLS-1)*CELL)/2, oz=18;
function cellToWorld(i,j){ return [ox+i*CELL, oz-j*CELL]; }
for(let j=0;j<ROWS;j++){
  for(let i=0;i<COLS;i++){
    const [wx,wz]=cellToWorld(i,j);
    if(i<COLS-1 && wallE[j][i]) tallShelf(wx+CELL/2, wz, CELL*0.95, V);
    if(j<ROWS-1 && wallS[j][i]) tallShelf(wx, wz-CELL/2, CELL*0.95, H);
  }
}

let audioCtx=null, groanGain=null, groanOn=false, staticGain=null, staticSrc=null;
function startStatic(){
  if(!audioCtx||staticGain) return;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  staticSrc=audioCtx.createBufferSource(); staticSrc.buffer=buf; staticSrc.loop=true;
  staticGain=audioCtx.createGain(); staticGain.gain.value=0;
  staticSrc.connect(staticGain); staticGain.connect(audioCtx.destination); staticSrc.start();
}
function sting(){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(); o.type="square"; o.frequency.setValueAtTime(920,t); o.frequency.exponentialRampToValueAtTime(70,t+.28);
  const o2=audioCtx.createOscillator(); o2.type="sawtooth"; o2.frequency.value=48;
  const g=audioCtx.createGain(); g.gain.setValueAtTime(.7,t); g.gain.exponentialRampToValueAtTime(.001,t+.32);
  const f=audioCtx.createBiquadFilter(); f.type="highpass"; f.frequency.value=300;
  o.connect(f); o2.connect(g); f.connect(g); g.connect(audioCtx.destination);
  o.start(t); o2.start(t); o.stop(t+.32); o2.stop(t+.32);
  const n=audioCtx.createBuffer(1,audioCtx.sampleRate*.12,audioCtx.sampleRate);
  const d=n.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  const s=audioCtx.createBufferSource(); s.buffer=n; const ng=audioCtx.createGain(); ng.gain.value=.4; s.connect(ng); ng.connect(audioCtx.destination); s.start(t);
}
function startBell(){
  if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  for(let i=0;i<5;i++){
    const o=audioCtx.createOscillator(); o.type="sine"; o.frequency.value=110;
    const o2=audioCtx.createOscillator(); o2.type="sine"; o2.frequency.value=165;
    const g=audioCtx.createGain();
    const t=t0+i*1.0;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.45,t+.05); g.gain.exponentialRampToValueAtTime(.001,t+.9);
    o.connect(g); o2.connect(g); g.connect(audioCtx.destination);
    o.start(t); o2.start(t); o.stop(t+1); o2.stop(t+1);
  }
}

function startAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  groanGain=audioCtx.createGain(); groanGain.gain.value=0;
  groanGain.connect(audioCtx.destination);
  function pulse(){
    if(!audioCtx) return;
    const o=audioCtx.createOscillator();
    o.type="sawtooth"; o.frequency.value=32+Math.random()*8;
    const o2=audioCtx.createOscillator(); o2.type="square"; o2.frequency.value=41.5+Math.random()*4;
    const f=audioCtx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=140;
    const g=audioCtx.createGain();
    const now=audioCtx.currentTime;
    g.gain.setValueAtTime(0,now);
    g.gain.linearRampToValueAtTime(0.7,now+.12);
    g.gain.exponentialRampToValueAtTime(0.001,now+.55+Math.random()*.4);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(groanGain);
    o.start(now); o2.start(now); o.stop(now+1.3); o2.stop(now+1.3);
    const nlen=.35, buf=audioCtx.createBuffer(1,audioCtx.sampleRate*nlen,audioCtx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const src=audioCtx.createBufferSource(); src.buffer=buf;
    const ng=audioCtx.createGain(); ng.gain.value=.25;
    src.connect(ng); ng.connect(groanGain); src.start(now);
  }
  setInterval(()=>{ if(groanOn) pulse(); }, 1100);
}
let hideAt=null;
document.querySelector("#hide").onclick=()=>{
  if(cut||!canMove)return;
  const near=hideSpots.find(([x,z])=>Math.hypot(camera.position.x-x,camera.position.z-z)<2.2);
  if(!near && !hiding){say("机の下へ。",1600);return;}
  hiding=!hiding;
  const hb=document.querySelector("#hide");
  hb.textContent=hiding?"出る":"隠れる";
  if(hiding){
    hideAt=near||hideAt;
    camera.position.set(hideAt[0],0.38,hideAt[1]+0.05);
    pitch=-0.15; yaw=yaw;
    say("机の下に潜った。",1600);
  }else{
    camera.position.set(hideAt[0],1.62,hideAt[1]+1.15);
    say("机から出た。",1600);
  }
};

function say(t,ms=2600){msg.textContent=t;clearTimeout(say._t);say._t=setTimeout(()=>{if(msg.textContent===t)msg.textContent=""},ms)}
function setObj(t){obj.textContent="目的："+t}
function showClock(t){clk.textContent=t;clk.style.opacity=1;setTimeout(()=>clk.style.opacity=0,3000)}
function cutTo(fn,hold=900){
  return new Promise(res=>{
    fade.style.transition="opacity .45s";fade.style.opacity=1;
    setTimeout(()=>{fn();fade.style.opacity=0;setTimeout(res,hold)},480);
  });
}

async function playVideo(src){
  const v=document.getElementById("op");
  v.src=src;
  v.style.display="block";
  const ok=await new Promise(res=>{
    const t=setTimeout(()=>res(false),4000);
    v.oncanplay=()=>res(true);
    v.onerror=()=>res(false);
  });
  if(!ok){ v.style.display="none"; return false; }
  try{ await v.play(); }catch(e){ v.muted=true; try{await v.play();}catch(e2){ v.style.display="none"; return false; } }
  await new Promise(res=>{
    v.onended=res;
    v.onclick=()=>{try{v.pause()}catch(e){};res()};
  });
  v.style.display="none";
  return true;
}
document.querySelector("#startBtn").onclick=async()=>{
  document.querySelector("#start").style.display="none"; startAudio(); startHeart(); startHum(); if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
  try{screen.orientation&&screen.orientation.lock("landscape")}catch(e){}
  cut=true;canMove=false;
  const had=await playVideo("opening.mp4");
  if(had){
    pitch=0;yaw=0;camera.position.set(0,1.62,14.1);canMove=true;cut=false;
    sunBall.visible=false;moon.visible=true;ambient.intensity=.32;ceiling.intensity=.55;sun.intensity=.08;
    scene.fog.near=4;scene.fog.far=18;scene.background.set(0x1a1816);scene.fog.color.set(0x1a1816);
    phase="door";setObj("入口へ向かう");
    say("赤い矢印の入口へ。",2400);
    return;
  }
  // 1 夕日＋上から
  camera.position.set(0,26,6);yaw=0;pitch=-1.15;
  scene.background.set(0xff6a2a);scene.fog.color.set(0xff6a2a);
  sunBall.visible=true;moon.visible=false;showClock("17:00");
  say("閉館前の、いつもの図書館。",2800);
  await new Promise(r=>setTimeout(r,3200));
  // 2 机
  await cutTo(()=>{
    camera.position.set(0,1.28,14.1);yaw=0;pitch=-.55;
    scene.background.set(0xc4a070);scene.fog.color.set(0xc4a070);scene.fog.near=10;scene.fog.far=36;
  });
  say("ページの端を、指で押さえている。",2600);
  await new Promise(r=>setTimeout(r,2800));
  // 3 上から月
  await cutTo(()=>{
    camera.position.set(0,26,6);pitch=-1.15;
    scene.background.set(0x0b1020);scene.fog.color.set(0x0b1020);
    sunBall.visible=false;moon.visible=true;ambient.intensity=.32;ceiling.intensity=.55;sun.intensity=.08;
    scene.fog.near=4;scene.fog.far=18;scene.background.set(0x1a1816);scene.fog.color.set(0x1a1816);
    showClock("22:00");
  });
  say("建物の上に、月が出ている。",2400);
  await new Promise(r=>setTimeout(r,2800));
  // 4 腕時計
  await cutTo(()=>{
    camera.position.set(0,1.28,14.1);pitch=-.85;yaw=0.35;
  });
  say("もうこんな時間か。帰ろう。",2800);
  await new Promise(r=>setTimeout(r,2600));
  pitch=0;yaw=0;camera.position.set(0,1.62,14.1);canMove=true;cut=false;
  scene.fog.near=4;scene.fog.far=18;ambient.intensity=.32; startHum(); if(humGain) humGain.gain.setTargetAtTime(.07, audioCtx?audioCtx.currentTime:0,.3);
  phase="door";setObj("入口へ向かう");
  say("赤い矢印の入口へ。",2400);
};

function checkAll(){
  if(ev.all) return;
  if(ev.pc&&ev.bell&&ev.face&&ev.books){
    ev.all=true; phase="returnDoor";
    setObj("入口へ戻る");
    say("入口へ。何かが、待っている。",2800);
  }
}
function tap(vol,hi){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(); o.type="triangle"; o.frequency.value=hi?420:310;
  const f=audioCtx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=hi?900:650; f.Q.value=2.2;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.004);
  g.gain.exponentialRampToValueAtTime(.001,t+.07);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+.08);
}
function foot(vol,freq){
  if(!audioCtx) return;
  tap(vol,true);
  setTimeout(()=>tap(vol*.75,false),70);
}
function mfoot(vol){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(); o.type="sine"; o.frequency.value=52;
  const g=audioCtx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+.18);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+.18);
}
let heartGain=null, heartOn=false;
let humGain=null;
function startHum(){
  if(!audioCtx||humGain) return;
  const o=audioCtx.createOscillator(); o.type="sine"; o.frequency.value=120;
  const o2=audioCtx.createOscillator(); o2.type="sine"; o2.frequency.value=121.7;
  const o3=audioCtx.createOscillator(); o3.type="triangle"; o3.frequency.value=60;
  const f=audioCtx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=280;
  humGain=audioCtx.createGain(); humGain.gain.value=0.07;
  o.connect(f); o2.connect(f); o3.connect(f); f.connect(humGain); humGain.connect(audioCtx.destination);
  o.start(); o2.start(); o3.start();
}
function startHeart(){
  if(!audioCtx||heartGain) return;
  heartGain=audioCtx.createGain(); heartGain.gain.value=0; heartGain.connect(audioCtx.destination);
  function beat(){
    if(!heartOn||!audioCtx) return;
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator(); o.type="sine"; o.frequency.value=48;
    const g=audioCtx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.9,t+.03);
    g.gain.exponentialRampToValueAtTime(.001,t+.12);
    o.connect(g); g.connect(heartGain);
    o.start(t); o.stop(t+.14);
    const o2=audioCtx.createOscillator(); o2.type="sine"; o2.frequency.value=38;
    const g2=audioCtx.createGain();
    g2.gain.setValueAtTime(0,t+.13);
    g2.gain.linearRampToValueAtTime(.55,t+.16);
    g2.gain.exponentialRampToValueAtTime(.001,t+.28);
    o2.connect(g2); g2.connect(heartGain);
    o2.start(t); o2.stop(t+.3);
  }
  setInterval(beat, 620);
}

function blocked(nx,nz){
  if(Math.abs(nx)>26||nz>28||nz<-32)return true;
  for(const s of solids){
    if(Math.abs(nx-s.x)<s.hx+.28 && Math.abs(nz-s.z)<s.hz+.28)return true;
  }
  return false;
}

let last=performance.now();
let bookFall=0,chased=false;
function animate(t){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,(t-last)/1000);last=t;
  arrow.position.y=.2+Math.sin(t*.004)*.15;
  {
    const near=hideSpots.some(([x,z])=>Math.hypot(camera.position.x-x,camera.position.z-z)<2.2);
    document.querySelector("#hide").style.display=(near||hiding)?"block":"none";
  }
  keys.forEach(k=>{k.rotation.y+=dt*2});

  if(!cut){
    let fwd=(keysHeld.KeyW?1:0)-(keysHeld.KeyS?1:0)-joyY;
    let str=(keysHeld.KeyD?1:0)-(keysHeld.KeyA?1:0)+joyX;
    const wantDash=dashing && stamina>0.02;
    if(wantDash) stamina=Math.max(0,stamina-dt/2.1);
    else stamina=Math.min(1,stamina+dt/4.2);
    const fill=document.getElementById("stamFill");
    if(fill){ fill.style.width=(stamina*100)+"%"; fill.style.background=stamina<.22?"#a33":"#c8c0a0"; }
    const base=phase==="chase"||phase==="keys"||phase==="escape"?2.6:2.2;
    const sp=(canMove&&!hiding? (wantDash?base*1.85:base):0)*dt;
    const nx=camera.position.x+(Math.sin(yaw)*fwd+Math.cos(yaw)*str)*sp;
    const nz=camera.position.z+(-Math.cos(yaw)*fwd+Math.sin(yaw)*str)*sp;
    if(!blocked(nx,camera.position.z))camera.position.x=nx;
    if(!blocked(camera.position.x,nz))camera.position.z=nz;
    if(!cut) camera.position.y=hiding?0.38:1.62;
    const moving=Math.abs(fwd)+Math.abs(str)>0.15 && canMove && !hiding;
    if(moving){
      stepT-=dt;
      if(stepT<=0){ foot(wantDash?.22:.14, wantDash?140:110); stepT=wantDash?.28:.48; }
    }
  }

  yawS+=(yaw-yawS)*Math.min(1,dt*5.5);
  pitchS+=(pitch-pitchS)*Math.min(1,dt*5.5);
  const tgt=new THREE.Vector3(
    camera.position.x+Math.sin(yawS)*Math.cos(pitchS),
    camera.position.y+Math.sin(pitchS),
    camera.position.z-Math.cos(yawS)*Math.cos(pitchS)
  );
  camera.lookAt(tgt);
  if(!cut && phase==="explore"){
    if(Math.abs(yaw)>0.8) seenAway=true;
    if(seenAway && !peeked && Math.abs(yaw)<0.25){
      peeked=true; ev.face=true;
      figure.visible=true;
      figure.position.set(camera.position.x+Math.sin(yawS)*1.7,0,camera.position.z-Math.cos(yawS)*1.7);
      fade.style.background="#fff"; fade.style.transition="opacity .05s"; fade.style.opacity=.7;
      setTimeout(()=>{fade.style.opacity=0; fade.style.background="#000";},90);
      sting();
      faceHold=.85;
      say("白い顔が、正面にある。",1600);
    }
  }
  if(faceHold>0){ faceHold-=dt; if(faceHold<=0 && phase==="explore"){ figure.visible=false; checkAll(); } }
  flashlight.position.copy(camera.position);
  flashlight.target.position.copy(tgt);

  const dDoor=Math.hypot(camera.position.x-0,camera.position.z-29);
  if(phase==="door"&&dDoor<3.2){
    say("開かない。鍵がかかっている。",2800);
    phase="explore";setObj("辺りを散策する");
  }

  const dPc=Math.hypot(camera.position.x-5,camera.position.z-24);
  if((phase==="explore"||phase==="returnDoor") && dPc<2.4 && !ev.pc){
    ev.pc=true;
    pcLight.color.set(0x88ffcc); pcLight.intensity=4;
    say("画面が、ひとりでに点いた。",2400);
    startStatic(); checkAll();
  }
  if(ev.pc && staticGain && audioCtx){
    const vol=Math.max(0,Math.min(1,(6-dPc)/6));
    staticGain.gain.setTargetAtTime(vol*0.55, audioCtx.currentTime, .08);
  }
  const dCk=Math.hypot(camera.position.x-0,camera.position.z+2);
  if((phase==="explore"||phase==="returnDoor") && dCk<3.2 && !ev.bell){
    ev.bell=true; bellDone=true; bellT=5;
    say("……",800);
    setTimeout(()=>{ say("鐘が鳴っている。",5000); startBell(); checkAll(); },900);
  }
  if(bellDone && bellT>0){ bellT-=dt; }
  if((phase==="explore"||phase==="returnDoor") && !ev.books && camera.position.z<8){
    ev.books=true;
    solids.slice(0,6).forEach(s=>{ s.x+=0.55; });
    say("本棚の位置が、変わっている。",2400);
    checkAll();
  }
  if(phase==="returnDoor" && dDoor<5.5 && !ev.turned){
    figure.visible=true;
    figure.position.set(0,0,26.4);
    figure.rotation.y=Math.PI;
    groanOn=true;
    say("うめき声がする。背を向けている。",2400);
    phase="approach";
    setObj("入口へ近づく");
  }
  if(phase==="approach"){
    groanOn=true;
    if(dDoor<3.4 && !ev.turned){
      ev.turned=true;
      figure.lookAt(camera.position.x,1.6,camera.position.z);
      sting();
      say("振り返った。",2000);
      phase="slowChase"; setObj("机の下に隠れる"); chased=true;
    }
  }

  if(bookFall>0){
    falling.position.y=Math.max(.05,2.4-bookFall*3);
    falling.rotation.z+=dt*4;bookFall+=dt;
  }

  const hunt=phase==="slowChase"||phase==="keys"||phase==="escape";
  if(!(hunt||phase==="approach")){ heartOn=false; if(heartGain) heartGain.gain.setTargetAtTime(0, audioCtx?audioCtx.currentTime:0,.25);
    if(phase!=="explore"||faceHold<=0) {groanOn=false;} if(groanGain&&!groanOn) groanGain.gain.setTargetAtTime(0, audioCtx?audioCtx.currentTime:0, .2); }
  if(hunt){
    if(!figure.visible){figure.visible=true}
    const fx=camera.position.x-figure.position.x,fz=camera.position.z-figure.position.z;
    const fd=Math.hypot(fx,fz)||1;
    const boost = phase==="slowChase" ? 0.38 : [1.35,1.7,2.2,2.9,3.9,6.4][Math.min(5,keysGot)];
    const spd=boost*dt;
    let mx=(hiding?0:(fx/fd)*spd*8), mz=(hiding?0:(fz/fd)*spd*8);
    let ngx=figure.position.x+mx, ngz=figure.position.z+mz;
    const bx=!blocked(ngx,figure.position.z), bz=!blocked(figure.position.x,ngz);
    if(bx) figure.position.x=ngx;
    if(bz) figure.position.z=ngz;
    if(!bx||!bz){
      stuck+=dt;
      const sx=-mz*1.6, sz=mx*1.6;
      if(!blocked(figure.position.x+sx,figure.position.z)) figure.position.x+=sx;
      if(!blocked(figure.position.x,figure.position.z+sz)) figure.position.z+=sz;
    } else stuck=0;
    figure.lookAt(camera.position.x,1.4,camera.position.z);
    const moving=!hiding && (bx||bz);
    if(moving){
      walkT+=dt*(2.2+boost*0.8);
      const w=Math.sin(walkT);
      figLegs[0].rotation.x=w*.55; figLegs[1].rotation.x=-w*.55;
      figArms[0].rotation.x=-w*.7; figArms[1].rotation.x=w*.7;
      figure.position.y=Math.abs(w)*.04;
    }else{
      figLegs.forEach(l=>l.rotation.x*=.85);
      figArms.forEach(a=>a.rotation.x*=.85);
      figure.position.y*=.85;
    }
    groanOn=true; heartOn=true; startHeart();
    if(heartGain){
      const hv=hiding?0.12: Math.max(.15, Math.min(.95,(10-fd)/10));
      heartGain.gain.setTargetAtTime(hv, audioCtx.currentTime, .1);
    }
    if(groanGain){
      const vol=hiding?0.08: Math.max(0, Math.min(1, (14-fd)/14));
      groanGain.gain.setTargetAtTime(vol*0.9, audioCtx?audioCtx.currentTime:0, .08);
    }
    mstepT-=dt;
    if(!hiding && mstepT<=0){
      mfoot(Math.max(.1,.55*(1-fd/16)));
      mstepT = fd<4 ? .38 : .7;
    }
    if(!hiding && fd<1.7&&hitCD<=0){
      hitCD=2;say("触れた。机の下へ。",1600);
      camera.position.x+= (Math.random()>.5?1.1:-1.1);
    }
    if(hitCD>0)hitCD-=dt;
    if(phase==="slowChase" && hiding){
      hideTimer+=dt;
      if(hideTimer>2.4 && !ev.hidOk){
        ev.hidOk=true;
        phase="keys"; setObj("鍵を集める 0 / 5");
        keys.forEach(k=>k.visible=true);
        say("巻いた。机の鍵を五つ。",2600);
      }
    } else if(phase==="slowChase") hideTimer=0;
  }

  if(phase==="keys"){
    keys.forEach(k=>{
      if(k.userData.got||!k.visible)return;
      if(Math.hypot(k.position.x-camera.position.x,k.position.z-camera.position.z)<1.3){
        k.userData.got=true;k.visible=false;keysGot++;
        setObj("鍵を集める "+keysGot+" / 5");
        say(keysGot>=5?"最後の鍵。足が、止まらない。":"鍵を拾った。後ろが速い。",1800);
        if(keysGot>=5){phase="escape";setObj("入口で脱出する");door.material.color.set(0x335533)}
      }
    });
  }
  if(phase==="escape"&&dDoor<2.4){
    phase="end";canMove=false;setObj("脱出");
    fade.style.transition="opacity .6s";fade.style.opacity=1;
    playVideo("ending.mp4").then(ok=>{
      if(!ok) say("外に出た。",4000);
      fade.style.opacity=1;
    });
  }

  renderer.render(scene,camera);
}
animate(performance.now());
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
